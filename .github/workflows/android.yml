name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: npm install

      - name: Add Android platform
        run: npx cap add android

      - name: Add storage permissions (older Android)
        run: |
          MF=android/app/src/main/AndroidManifest.xml
          node -e "
          const fs=require('fs');const p='$MF';let s=fs.readFileSync(p,'utf8');
          const perms='    <uses-permission android:name=\"android.permission.WRITE_EXTERNAL_STORAGE\" android:maxSdkVersion=\"29\" />\n    <uses-permission android:name=\"android.permission.READ_EXTERNAL_STORAGE\" android:maxSdkVersion=\"32\" />\n';
          if(!s.includes('WRITE_EXTERNAL_STORAGE')){s=s.replace('</manifest>',perms+'</manifest>');}
          s=s.replace('<application','<application android:requestLegacyExternalStorage=\"true\"');
          fs.writeFileSync(p,s);"

      - name: Sync web assets
        run: npx cap sync android

      - name: Build debug APK
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: maghaze-hesab-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
